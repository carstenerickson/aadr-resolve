# Fields not present in this class (canonical names unmapped here):
#   - persistent_genetic_id
#   - pulldown_strategy
#   - snps_hit_ho
#   - assessment_warnings

notes:
  - "v44.3 has 43 columns; v50.0 has 44 (adds 'Age at Death Estimate' at col 12)."
  - "Both versions call the per-row identifier 'Version ID' (col 2), not 'Genetic ID'."
  - "v44.3 spells the group column 'GroupID' (no space); v50.0 spells it 'Group ID'. Match-normalization (lowercase + collapse non-word chars) maps both to 'group_id'."
  - "Both have an 'Index' column at position 1; dropped by class C."
  - "Class A has ONE 'SNPs hit on autosomal targets' column (col 21) without a 1240k vs HO discriminator — mapped to 'snps_hit_1240k' (v44/v50 were 1240k-only). 'snps_hit_ho' remains unmapped."
  - "'Molecular Sex' field is just 'Sex' in v44/v50 (col 23)."
  - "Pulldown Strategy column not present in v44/v50 — this metadata was tracked at a coarser granularity (the 'Data source' column)."
  - "Coverage column (col 20 'Coverage on autosomal targets') is BAM-coverage (whole-shotgun), not 1240k-specific. Mapped here to 'coverage_1240k' as the closest semantic proxy; modern array-genotyped samples appear with empty value."
  - "Date column ('Date mean in BP') is at col 10 in v44.3 (extra 'Representative contact' col 8 before it) and col 9 in v50.0. Both clean integer calBP, no nulls."
