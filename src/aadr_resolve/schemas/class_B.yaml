notes:
  - "Same 'Index' column at position 1 as class A; dropped by class C."
  - "Per-row identifier renamed 'Version ID' → 'Genetic ID' here (vs class A)."
  - Sample I21276 has an embedded quote character; loader MUST use csv.QUOTE_NONE.
  - "BOTH bam-cov (col 21 'Coverage on autosomal targets') AND 1240k-cov (col 22 '1240k coverage') are present. Matcher priority maps col 22 → 'coverage_1240k' (the canonical native)."
  - "v52.2 coverage column has 24 rows with non-numeric values prefixed by stray `\\xef\\xbf\\xbd` (Unicode replacement chars from earlier encoding bugs): '\\xef\\xbf\\xbd0.004384', '\\xef\\xbf\\xbd0.158431', etc. Loader should strip the prefix or coerce-to-NaN. Affects <0.2% of v52 rows."
