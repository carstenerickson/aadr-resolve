# AADR `.anno` schema class D
# Generated from bench-verify pass 2026-05-11 (see scripts/ancestry/aadr-resolve/bench/).
# To regenerate after a new AADR release, run: python gen_schemas.py

class_id: D
applies_to:
  - v62.0
n_columns: 42
detection_signature:
  col_0_normalized: genetic_id
  col_1_normalized: master_id
