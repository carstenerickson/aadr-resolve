name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Mypy --strict
        run: mypy src/

      - name: "Pytest (default: no slow/external/perf) + coverage gate"
        # Coverage config (omit list, exclude_lines, branch=True) lives in
        # .coveragerc. Gate at 85% per LLD §5.6.
        run: pytest -ra --cov=aadr_resolve --cov-fail-under=85

  slow:
    name: Slow tests (Linux / Python 3.13)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest slow + perf (no external)
        # external tests need AADR_CACHE; covered by a separate gated job.
        # The synth perf variant + any other @slow tests run here.
        run: pytest -m "slow and not external" -ra

  external:
    name: External tests (AADR_CACHE required)
    runs-on: ubuntu-latest
    needs: test
    # Skip when there's no cache configured. CI populates AADR_CACHE via
    # a self-hosted runner or a future Dataverse fetch step; for now this
    # job is documented but disabled. Devs can run it locally with:
    #   AADR_CACHE=/path/to/cache pytest -m external
    if: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest external
        env:
          AADR_CACHE: ${{ secrets.AADR_CACHE_PATH }}
        run: pytest -m external -ra
