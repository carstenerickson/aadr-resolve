name: Publish to PyPI

on:
  release:
    types: [published]

# Run only after CI is green on main.
permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (OIDC)
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing requires id-token write.
    permissions:
      id-token: write
    # PyPI is configured to expect a pending publisher pointing at
    # carstenerickson/aadr-resolve and this workflow file. See
    # docs/RELEASE.md for setup.
    environment:
      name: pypi
      url: https://pypi.org/p/aadr-resolve
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
